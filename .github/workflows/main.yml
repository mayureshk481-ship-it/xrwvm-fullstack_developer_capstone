name: Lint Code

on:
  push:
    branches: [main]

jobs:
  lint_python:
    name: Lint Python files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install flake8
      - name: Print Python files
        run: find . -name "*.py" -not -path "./server/djangoenv/*"
      - name: Lint with flake8
        run: flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=djangoenv,node_modules